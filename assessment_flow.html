
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:1rem 0;font-family:var(--font-sans)}
.role-tabs{display:flex;gap:0;margin-bottom:1.5rem;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden}
.rtab{flex:1;padding:10px 8px;font-size:12px;font-weight:500;border:none;cursor:pointer;background:transparent;color:var(--color-text-secondary);transition:all .15s;border-right:0.5px solid var(--color-border-secondary)}
.rtab:last-child{border-right:none}
.rtab.active{color:#fff}
.flow{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:stretch;margin-bottom:0}
.step-left{display:flex;flex-direction:column;align-items:center;width:36px;flex-shrink:0}
.step-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#fff;flex-shrink:0}
.step-line{width:2px;flex:1;min-height:16px;margin:4px 0}
.step-body{flex:1;padding-bottom:20px}
.step-title{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.step-desc{font-size:12px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:8px}
.step-details{display:flex;flex-direction:column;gap:4px}
.detail{font-size:11px;color:var(--color-text-secondary);padding:5px 10px;background:var(--color-background-secondary);border-radius:6px;border-left:2px solid var(--color-border-secondary);line-height:1.5}
.detail b{font-weight:500;color:var(--color-text-primary)}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;font-weight:500;margin-left:6px;vertical-align:middle}
.flow-link{font-size:11px;padding:6px 10px;border-radius:6px;border:0.5px dashed var(--color-border-secondary);color:var(--color-text-tertiary);margin-top:4px;line-height:1.5}
.section-bar{font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 12px 48px}
</style>

<div class="wrap">
<h2 class="sr-only">Assessment workflow by role — admin, teacher, student, parent</h2>
<div class="role-tabs" id="tabs"></div>
<div id="content"></div>
</div>

          "<b>Max marks</b> — e.g. 100. System uses this to calculate percentage.",
          "<b>Due date for entry</b> — deadline by which teacher must submit marks.",

        ],

      },

  {

        details:[

        ],
        tag:"Auto-triggered", tagColor:"#185FA5"
      },

          "<b>Attendance link</b> — marks and attendance shown together — poor attendance explains low marks.",
          "<b>Multi-child switch</b> — parent with 2 children switches between them in one tap.",
        ],
        tag:"Main view", tagColor:"#1D9E75"
      },
      {
        title:"Download report card",
        desc:"Parent can download and save the official report card PDF anytime.",
        details:[
          "<b>Report card tab</b> — term selector dropdown, then download PDF button.",
          "<b>Historical cards</b> — all past terms accessible, not just current.",
          "<b>Share</b> — parent can share PDF directly from portal for scholarship applications etc.",
        ],
        tag:"On demand", tagColor:"#888780"
      },
      {
        title:"Check promotion / demotion result",
        desc:"At year end, parent sees whether their child has been promoted — with clear explanation.",
        details:[
          "<b>Promotion banner</b> — 'Aisha has been promoted to Grade 6 starting September 2025. Congratulations!'",
          "<b>Demotion notice</b> — 'Ravi did not meet the passing criteria in 2 subjects. Please contact the school.'",

const tabs = document.getElementById('tabs');
const content = document.getElementById('content');

function render(role) {
  tabs.querySelectorAll('.rtab').forEach((t,j)=>{
    t.classList.toggle('active', roles[j].id===role.id);
    t.style.background = roles[j].id===role.id ? role.color : '';
  });
  let html = '<div class="flow">';
  role.steps.forEach((s,i) => {
    const isLast = i === role.steps.length - 1;
    html += `<div class="step">
      <div class="step-left">
        <div class="step-num" style="background:${role.color}">${i+1}</div>
        ${!isLast ? `<div class="step-line" style="background:${role.color}33"></div>` : ''}
      </div>
      <div class="step-body">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <div class="step-title">${s.title}</div>
          <span class="tag" style="background:${s.tagColor}22;color:${s.tagColor}">${s.tag}</span>
        </div>
        <div class="step-desc">${s.desc}</div>
        <div class="step-details">
          ${s.details.map(d=>`<div class="detail">${d}</div>`).join('')}
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  content.innerHTML = html;
}

roles.forEach((r,i) => {
  const btn = document.createElement('button');
  btn.className = 'rtab' + (i===0?' active':'');
  btn.textContent = r.label;
  btn.style.background = i===0 ? r.color : '';
  btn.style.color = i===0 ? '#fff' : '';
  btn.onclick = () => render(r);
  tabs.appendChild(btn);
});

render(roles[0]);
</script>
