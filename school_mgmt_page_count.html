*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:1rem 0;font-family:var(--font-sans)}
.top-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.25rem}
.ttab{padding:6px 14px;font-size:12px;border:0.5px solid var(--color-border-secondary);border-radius:20px;cursor:pointer;background:transparent;color:var(--color-text-secondary);transition:all .15s}
.ttab.active{font-weight:500}
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 14px;text-align:center}
.stat-num{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.stat-label{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.section-title{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:10px;padding-bottom:6px;border-bottom:0.5px solid var(--color-border-tertiary)}
.feat-table{width:100%;border-collapse:collapse;margin-bottom:1.5rem}
.feat-table th{font-size:11px;color:var(--color-text-tertiary);font-weight:400;text-align:left;padding:7px 12px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.feat-table td{font-size:12px;padding:8px 12px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:top;color:var(--color-text-primary)}
.feat-table tr:last-child td{border-bottom:none}
.feat-table td:nth-child(1){width:180px;font-weight:500}
.feat-table td:nth-child(2){width:280px;color:var(--color-text-secondary);font-size:11px;line-height:1.5}
.feat-table td:nth-child(3){text-align:center;width:60px}
.feat-table td:nth-child(4){font-size:11px;color:var(--color-text-tertiary);line-height:1.5}
.sub-label{font-size:12px;font-weight:500;color:var(--color-text-primary);padding:10px 12px 4px;background:var(--color-background-tertiary);border-bottom:0.5px solid var(--color-border-tertiary)}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}
.total-row td{font-weight:500;background:var(--color-background-secondary)}
.progress{height:4px;border-radius:2px;background:var(--color-border-tertiary);margin-top:4px}
.progress-fill{height:4px;border-radius:2px}
</style>

const tabs = document.getElementById('tabs');
const summary = document.getElementById('summary');
const content = document.getElementById('content');

function countPages(m) {
  return m.subs.reduce((a,s)=>a+s.features.reduce((b,f)=>b+f[2],0),0);
}

const totalPages = modules.reduce((a,m)=>a+countPages(m),0);
const totalFeatures = modules.reduce((a,m)=>a+m.subs.reduce((b,s)=>b+s.features.length,0),0);
const totalSubs = modules.reduce((a,m)=>a+m.subs.length,0);

function renderSummary(m) {
  const pages = m ? countPages(m) : totalPages;
  const feats = m ? m.subs.reduce((a,s)=>a+s.features.length,0) : totalFeatures;
  const subs = m ? m.subs.length : totalSubs;
  const mods = m ? 1 : modules.length;
  summary.innerHTML = `
    <div class="stat"><div class="stat-num" style="color:${m?m.color:'var(--color-text-primary)'}">${mods}</div><div class="stat-label">${m?'module':'modules'}</div></div>
    <div class="stat"><div class="stat-num" style="color:${m?m.color:'var(--color-text-primary)'}">${subs}</div><div class="stat-label">submodules</div></div>
    <div class="stat"><div class="stat-num" style="color:${m?m.color:'var(--color-text-primary)'}">${feats}</div><div class="stat-label">features</div></div>
    <div class="stat"><div class="stat-num" style="color:${m?m.color:'var(--color-text-primary)'}">${pages}</div><div class="stat-label">pages / screens</div></div>
  `;
}

function renderAll() {
  renderSummary(null);
  let html = '';
  modules.forEach(m => {
    const mPages = countPages(m);
    html += `<div class="section-title" style="color:${m.color}">${m.label} — ${mPages} pages</div>`;
    html += `<table class="feat-table"><thead><tr><th>Feature / screen</th><th>Pages it needs</th><th>Count</th><th>Screen names</th></tr></thead><tbody>`;
    m.subs.forEach(s => {
      html += `<tr><td colspan="4" class="sub-label">${s.name}</td></tr>`;
      s.features.forEach(f => {
        html += `<tr><td>${f[0]}</td><td style="color:var(--color-text-secondary);font-size:11px">${f[1]}</td><td style="text-align:center"><span class="badge" style="background:${m.color}22;color:${m.color}">${f[2]}</span></td><td style="font-size:11px;color:var(--color-text-tertiary)">${f[3].join(', ')}</td></tr>`;
      });
    });
    const subTotal = mPages;
    html += `<tr class="total-row"><td colspan="2" style="text-align:right;font-size:12px;color:var(--color-text-secondary)">Subtotal for ${m.label}</td><td style="text-align:center"><span class="badge" style="background:${m.color};color:#fff">${subTotal}</span></td><td></td></tr>`;
    html += `</tbody></table>`;
  });
  html += `<table class="feat-table"><tbody><tr class="total-row"><td colspan="2" style="font-size:14px">Total pages across entire system</td><td style="text-align:center"><span class="badge" style="background:var(--color-text-primary);color:var(--color-background-primary);font-size:13px;padding:4px 12px">${totalPages}</span></td><td></td></tr></tbody></table>`;
  content.innerHTML = html;
}

function renderModule(m) {
  renderSummary(m);
  let html = '';
  html += `<table class="feat-table"><thead><tr><th>Feature / screen</th><th>Description</th><th>Pages</th><th>Screen names</th></tr></thead><tbody>`;
  m.subs.forEach(s => {
    html += `<tr><td colspan="4" class="sub-label">${s.name}</td></tr>`;
    s.features.forEach(f => {
      html += `<tr><td>${f[0]}</td><td style="font-size:11px;color:var(--color-text-secondary)">${f[1]}</td><td style="text-align:center"><span class="badge" style="background:${m.color}22;color:${m.color}">${f[2]}</span></td><td style="font-size:11px;color:var(--color-text-tertiary)">${f[3].join(', ')}</td></tr>`;
    });
  });
  const total = countPages(m);
  html += `<tr class="total-row"><td colspan="2" style="text-align:right;font-size:12px;color:var(--color-text-secondary)">Total for ${m.label}</td><td style="text-align:center"><span class="badge" style="background:${m.color};color:#fff;font-size:12px">${total}</span></td><td></td></tr>`;
  html += `</tbody></table>`;
  content.innerHTML = html;
}

const allBtn = document.createElement('button');
allBtn.className = 'ttab active';
allBtn.textContent = 'All modules';
allBtn.onclick = () => {
  document.querySelectorAll('.ttab').forEach(t=>t.classList.remove('active'));
  allBtn.classList.add('active');
  allBtn.style = '';
  renderAll();
};
tabs.appendChild(allBtn);

modules.forEach((m,i) => {
  const btn = document.createElement('button');
  btn.className = 'ttab';
  btn.textContent = m.label;
  btn.onclick = () => {
    document.querySelectorAll('.ttab').forEach(t=>{t.classList.remove('active');t.style='';});
    btn.classList.add('active');
    btn.style = `background:${m.color}22;color:${m.color};border-color:${m.color}44`;
    renderModule(m);
  };
  tabs.appendChild(btn);
});

renderAll();
</script>
