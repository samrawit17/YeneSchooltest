services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sms_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lemari}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lemari_password}
      POSTGRES_DB: ${DB_NAME:-lemarisms}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sms_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sms_redis_dev
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lemari_redis_password}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lemari_redis_password} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_dev:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-lemari_redis_password}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sms_network

  # Backend API (NestJS) - Development with hot reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: sms_backend_dev
    restart: unless-stopped
    environment:
      HOME: /app
      NODE_ENV: development
      PORT: 8001
      PRISMA_SCHEMA_SYNC: ${PRISMA_SCHEMA_SYNC:-migrate}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      PRISMA_SKIP_SEED: ${PRISMA_SKIP_SEED:-1}
      DATABASE_URL: postgresql://${DB_USER:-lemari}:${DB_PASSWORD:-lemari_password}@postgres:5432/${DB_NAME:-lemarisms}
      DIRECT_DATABASE_URL: postgresql://${DB_USER:-lemari}:${DB_PASSWORD:-lemari_password}@postgres:5432/${DB_NAME:-lemarisms}
      DATABASE_POOL_URL: postgresql://${DB_USER:-lemari}:${DB_PASSWORD:-lemari_password}@postgres:5432/${DB_NAME:-lemarisms}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-25}
      DATABASE_POOL_CONNECTION_TIMEOUT_MS: ${DATABASE_POOL_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_POOL_IDLE_TIMEOUT_MS: ${DATABASE_POOL_IDLE_TIMEOUT_MS:-30000}
      DATABASE_SEED_POOL_MAX: ${DATABASE_SEED_POOL_MAX:-2}
      REDIS_URL: redis://:${REDIS_PASSWORD:-lemari_redis_password}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-BMR9t5PPHg2Jko1VPZ2fDlmX9lEN303BH6Z-2bpKe7lf-7MxX3quJhCYYtKbJlho-CVzr2uW-aDELgUMW7rGiio}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-akmPXo7n_zVhuXGjPB_GsS_G_mkzqc-WC9OF2d8mzLg}
      WEB_PUSH_CONTACT_EMAIL: ${WEB_PUSH_CONTACT_EMAIL:-mailto:admin@school管理系统.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      RATE_LIMIT_MAX: 120
      RATE_LIMIT_WINDOW_SEC: 60
      TRUST_PROXY: 1
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-admin123}
    volumes:
      - ./backend:/app
      - /app/.next
    ports:
      - "8001:8001"
      - "9229:9229"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      # The dev entrypoint runs Prisma sync and seeding before Nest binds :8001.
      # First boot can exceed a minute on a fresh database, so give it more time.
      start_period: 180s
    user: root
    entrypoint: /app/docker-entrypoint.sh
    command: npm run start:dev
    networks:
      - sms_network

  # Frontend (Next.js) - Development with hot reload
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: sms_frontend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8001
      BACKEND_URL: http://backend:8001
      NEXT_PUBLIC_WEB_PUSH_KEY: ${WEB_PUSH_PUBLIC_KEY:-BMR9t5PPHg2Jko1VPZ2fDlmX9lEN303BH6Z-2bpKe7lf-7MxX3quJhCYYtKbJlho-CVzr2uW-aDELgUMW7rGiio}
    volumes:
      - ./frontend:/app
      - /app/.next
    ports:
      - "8000:8000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/sign-in').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    command: sh -c "npm run dev -- --hostname 0.0.0.0"
    networks:
      - sms_network

  nginx:
    image: nginx:alpine
    container_name: sms_nginx_dev
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - sms_network

# Docker Networks
networks:
  sms_network:
    driver: bridge

# Docker Volumes
volumes:
  postgres_data_dev:
    external: true
    name: sms_postgres_data
  redis_data_dev:
    driver: local
