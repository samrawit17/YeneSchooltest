services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-usman}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-834927615}
      POSTGRES_DB: ${DB_NAME:-sms_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-usman}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sms_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sms_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-834927615}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sms_network

  # Backend API (NestJS)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: sms_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8001
      PRISMA_SKIP_SEED: ${PRISMA_SKIP_SEED:-1}
      DATABASE_URL: postgresql://${DB_USER:-usman}:${DB_PASSWORD:-834927615}@postgres:5432/${DB_NAME:-sms_db}
      DIRECT_DATABASE_URL: postgresql://${DB_USER:-usman}:${DB_PASSWORD:-834927615}@postgres:5432/${DB_NAME:-sms_db}
      DATABASE_POOL_URL: postgresql://${DB_USER:-usman}:${DB_PASSWORD:-834927615}@postgres:5432/${DB_NAME:-sms_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-834927615}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-BMR9t5PPHg2Jko1VPZ2fDlmX9lEN303BH6Z-2bpKe7lf-7MxX3quJhCYYtKbJlho-CVzr2uW-aDELgUMW7rGiio}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-akmPXo7n_zVhuXGjPB_GsS_G_mkzqc-WC9OF2d8mzLg}
      WEB_PUSH_CONTACT_EMAIL: ${WEB_PUSH_CONTACT_EMAIL:-mailto:admin@school管理系统.com}
      RATE_LIMIT_MAX: 120
      RATE_LIMIT_WINDOW_SEC: 60
      TRUST_PROXY: 1
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sms_network

  # Frontend (Next.js) - Development with hot reload
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sms_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_WEB_PUSH_KEY: ${WEB_PUSH_PUBLIC_KEY:-BMR9t5PPHg2Jko1VPZ2fDlmX9lEN303BH6Z-2bpKe7lf-7MxX3quJhCYYtKbJlho-CVzr2uW-aDELgUMW7rGiio}
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8000:8000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/sign-in').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    command:
      - sh
      - -lc
      - npm run dev -- --hostname 0.0.0.0
    networks:
      - sms_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sms_network

# Docker Networks
networks:
  sms_network:
    driver: bridge

# Docker Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
