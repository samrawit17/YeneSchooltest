services:
  postgres:
    image: postgres:16-alpine
    container_name: sms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lemari}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lemari_password}
      POSTGRES_DB: ${DB_NAME:-lemarisms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sms_network

  redis:
    image: redis:7-alpine
    container_name: sms_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lemari_redis_password}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lemari_redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-lemari_redis_password}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: sms_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      PRISMA_SCHEMA_SYNC: ${PRISMA_SCHEMA_SYNC:-push}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      PRISMA_SKIP_SEED: ${PRISMA_SKIP_SEED:-1}
      DATABASE_URL: postgresql://${DB_USER:-lemari}:${DB_PASSWORD:-lemari_password}@postgres:5432/${DB_NAME:-lemarisms}
      DIRECT_DATABASE_URL: postgresql://${DB_USER:-lemari}:${DB_PASSWORD:-lemari_password}@postgres:5432/${DB_NAME:-lemarisms}
      DATABASE_POOL_URL: postgresql://${DB_USER:-lemari}:${DB_PASSWORD:-lemari_password}@postgres:5432/${DB_NAME:-lemarisms}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-25}
      DATABASE_POOL_CONNECTION_TIMEOUT_MS: ${DATABASE_POOL_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_POOL_IDLE_TIMEOUT_MS: ${DATABASE_POOL_IDLE_TIMEOUT_MS:-30000}
      DATABASE_SEED_POOL_MAX: ${DATABASE_SEED_POOL_MAX:-2}
      REDIS_URL: redis://:${REDIS_PASSWORD:-lemari_redis_password}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-BMR9t5PPHg2Jko1VPZ2fDlmX9lEN303BH6Z-2bpKe7lf-7MxX3quJhCYYtKbJlho-CVzr2uW-aDELgUMW7rGiio}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-akmPXo7n_zVhuXGjPB_GsS_G_mkzqc-WC9OF2d8mzLg}
      WEB_PUSH_CONTACT_EMAIL: ${WEB_PUSH_CONTACT_EMAIL:-mailto:admin@lemarisms.local}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW_SEC: ${RATE_LIMIT_WINDOW_SEC:-60}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: sms_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      NEXT_PUBLIC_WEB_PUSH_KEY: ${WEB_PUSH_PUBLIC_KEY:-BMR9t5PPHg2Jko1VPZ2fDlmX9lEN303BH6Z-2bpKe7lf-7MxX3quJhCYYtKbJlho-CVzr2uW-aDELgUMW7rGiio}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sms_network

  nginx:
    image: nginx:alpine
    container_name: sms_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - sms_network

networks:
  sms_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
