services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: sms_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      PRISMA_SKIP_SEED: ${PRISMA_SKIP_SEED:-1}
      DATABASE_URL: postgresql://${DB_USER:-usman}:${DB_PASSWORD:-834927615}@localhost:5432/${DB_NAME:-sms_db}
      DIRECT_DATABASE_URL: postgresql://${DB_USER:-usman}:${DB_PASSWORD:-834927615}@localhost:5432/${DB_NAME:-sms_db}
      DATABASE_POOL_URL: postgresql://${DB_USER:-usman}:${DB_PASSWORD:-834927615}@localhost:5432/${DB_NAME:-sms_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-834927615}@localhost:6379/0
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-BMR9t5PPHg2Jko1VPZ2fDlmX9lEN303BH6Z-2bpKe7lf-7MxX3quJhCYYtKbJlho-CVzr2uW-aDELgUMW7rGiio}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-akmPXo7n_zVhuXGjPB_GsS_G_mkzqc-WC9OF2d8mzLg}
      WEB_PUSH_CONTACT_EMAIL: ${WEB_PUSH_CONTACT_EMAIL:-mailto:admin@school管理系统.com}
      RATE_LIMIT_MAX: 120
      RATE_LIMIT_WINDOW_SEC: 60
      TRUST_PROXY: 1
    ports:
      - "5000:5000"
    network_mode: host

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: sms_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_WEB_PUSH_KEY: ${WEB_PUSH_PUBLIC_KEY:-BMR9t5PPHg2Jko1VPZ2fDlmX9lEN303BH6Z-2bpKe7lf-7MxX3quJhCYYtKbJlho-CVzr2uW-aDELgUMW7rGiio}
    ports:
      - "3000:3000"
    network_mode: host

  nginx:
    image: nginx:alpine
    container_name: sms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    network_mode: host